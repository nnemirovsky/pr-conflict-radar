name: pr-conflict-radar
on:
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false
      dry-run:
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: read
concurrency:
  group: pr-conflict-radar-${{ github.ref }}-${{ inputs.dry-run && 'dry-run' || 'publish' }}
  cancel-in-progress: false
jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
      statuses: read
    steps:
      - uses: actions/checkout@v7
      - uses: nnemirovsky/pr-conflict-radar@0000000000000000000000000000000000000000
        with:
          force: ${{ inputs.force || false }}
          dry-run: ${{ inputs.dry-run || (github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch) }}
