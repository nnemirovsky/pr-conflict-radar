name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag is the release: refuse one that disagrees with a version the
      # repo declares (plugin manifest, package.json, pyproject.toml).
      - name: check the tag matches the declared versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          check() {  # check <file> <version>
            if [ -n "$2" ] && [ "$2" != "$tag" ]; then
              echo "tag $GITHUB_REF_NAME does not match $1 version $2" >&2; fail=1
            fi
          }
          # every plugin manifest in the repo, at any depth, and package.json
          for f in $(git ls-files '.claude-plugin/plugin.json' '*/.claude-plugin/plugin.json') package.json; do
            [ -f "$f" ] && check "$f" "$(jq -r '.version // empty' "$f")"
          done
          [ -f pyproject.toml ] && check pyproject.toml "$(grep -m1 -oE '^version *= *"[^"]+"' pyproject.toml | cut -d'"' -f2)"
          # a dynamic version lives in the package as __version__
          for f in $(git ls-files '*/_version.py' '*/__init__.py'); do
            check "$f" "$(grep -m1 -oE '^__version__ *= *"[^"]+"' "$f" | cut -d'"' -f2)"
          done
          exit "$fail"

      # gh ships on the runner, so no third-party action is needed. A release
      # already published from a workstation is left as it is.
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
